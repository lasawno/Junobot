[project]
name = "junobot"
version = "0.1.0"
description = "Broker-agnostic trading bot (Alpaca + Robinhood)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.30.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.38.0",
    "feedparser>=6.0.11",
    "vaderSentiment>=3.3.2",
]

[project.scripts]
junobot = "junobot.cli:app"
junobot-ui = "junobot.ui.launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junobot"]

[tool.ruff]
line-length = 100
target-version = "py312"
